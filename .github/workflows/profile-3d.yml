name: GitHub Profile 3D Contrib

on:
  schedule:
    # Runs at 18:00 UTC (01:00 WIB)
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Clawtan
      - name: Commit & Push
        run: |
          git config user.name "Clawtan"
          git config user.email "azzariaalfin@gmail.com"
          git add -A .
          if git commit -m "chore(contrib): update 3d contribution graph [skip ci]"; then
            git push
          fi
